# RAG System Configuration

# PDF Extraction Settings
pdf_extraction:
  extract_images: false
  extract_tables: true
  ocr_enabled: false

# Chunking Strategy
chunking:
  strategy: "semantic"  # Options: fixed, semantic, hybrid
  chunk_size: 1000
  chunk_overlap: 200
  min_chunk_size: 100
  max_chunk_size: 2000

# Embedding Settings
embeddings:
  provider: "sentence-transformers"  # Options: openai, sentence-transformers
  model_name: "all-MiniLM-L6-v2"  # For sentence-transformers
  # model_name: "text-embedding-ada-002"  # For OpenAI
  batch_size: 32
  normalize: true

# Vector Store Settings
vector_store:
  provider: "faiss"  # Options: faiss, chroma
  index_type: "IndexFlatL2"  # FAISS index type
  similarity_metric: "cosine"
  persist_directory: "./data/vector_store"

# Retrieval Settings
retrieval:
  top_k: 5
  score_threshold: 0.7
  reranking: true
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

# LLM Settings
llm:
  provider: "openai"  # Options: openai, anthropic
  model_name: "gpt-3.5-turbo"
  temperature: 0.1
  max_tokens: 1000
  timeout: 30

# RAG Pipeline Settings
rag:
  max_context_length: 4000
  prompt_template: |
    Context information is below.
    ---------------------
    {context}
    ---------------------
    Given the context information and not prior knowledge, answer the query.
    Query: {query}
    Answer:

# Evaluation Settings
evaluation:
  metrics:
    - "retrieval_precision"
    - "retrieval_recall"
    - "mrr"
    - "ndcg"
    - "rouge"
    - "bert_score"
    - "answer_relevancy"
    - "faithfulness"
  test_dataset_path: "./data/eval/test_questions.json"

# Logging
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"
  log_file: "./logs/rag_system.log"

# Cache Settings
cache:
  enabled: true
  cache_dir: "./data/cache"
  ttl: 3600  # Time to live in seconds
